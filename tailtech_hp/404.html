<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 ページが見つかりません | Tail Tech</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { --navy: #0A3C8F; --ink: #071936; --muted: #5D6B82; --line: #DCE6F5; }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    text-align: center;
    padding: 40px 24px;
    font-family: Nunito, "Hiragino Maru Gothic ProN", "Noto Sans JP", sans-serif;
    color: var(--ink);
    background: #fff;
  }
  .code {
    font-size: clamp(80px, 20vw, 140px);
    font-weight: 950;
    line-height: 1;
    color: var(--navy);
    letter-spacing: -4px;
  }
  h1 { margin: 0; font-size: clamp(20px, 4vw, 28px); font-weight: 900; }
  p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.8; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    padding: 14px 28px;
    background: var(--navy);
    color: #fff;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 900;
    text-decoration: none;
    transition: opacity .18s;
  }
  .btn:hover { opacity: .85; }
</style>
</head>
<body>
  <div class="code">404</div>
  <h1>ページが見つかりません</h1>
  <p>お探しのページは移動・削除されたか、<br>URLが間違っている可能性があります。</p>
  <a class="btn" href="/">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12L12 3l9 9M5 10v9h5v-5h4v5h5v-9"/></svg>
    トップページへ戻る
  </a>
</body>
</html>
