<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Tail Techへのお問い合わせはこちら。AI活用・業務効率化・システム開発について、初回相談・お見積もりは無料です。">
<link rel="canonical" href="https://tail-tech.jp/contact.html">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>お問い合わせ | Tail Tech</title>
<script>
  window.addEventListener('load', function() {
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=G-V9KQ2YSTVH';
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function(){window.dataLayer.push(arguments);};
    window.gtag('js', new Date());
    window.gtag('config', 'G-V9KQ2YSTVH');
  });
</script>
<style>
  :root { --navy:#0A3C8F; --navy-dark:#061B45; --blue-soft:#EDF5FF; --ink:#071936; --muted:#5D6B82; --line:#DCE6F5; --shadow:0 18px 45px rgba(10,60,143,.11); }
  *,*::before,*::after { box-sizing:border-box; }
  body { margin:0; color:var(--ink); background:linear-gradient(180deg,#f7faff 0,#fff 54%); font-family:Nunito,"Arial Rounded MT Bold","M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif; line-height:1.8; }
  a { color:inherit; text-decoration:none; }
  .container { width:min(920px,calc(100% - 40px)); margin:0 auto; }
  .header { border-bottom:1px solid var(--line); background:rgba(255,255,255,.88); backdrop-filter:blur(14px); }
  .header-inner { min-height:82px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
  .brand-image { width:auto; height:64px; object-fit:contain; }
  .back-link { color:var(--navy); font-size:14px; font-weight:900; }
  main { padding:clamp(48px,8vw,86px) 0; }
  .heading { margin-bottom:30px; text-align:center; }
  .eyebrow { margin:0 0 8px; color:var(--navy); font-size:13px; font-weight:900; letter-spacing:.08em; }
  h1 { margin:0; color:var(--navy-dark); font-size:clamp(30px,5vw,42px); line-height:1.4; }
  .lead { max-width:620px; margin:14px auto 0; color:var(--muted); font-size:15px; font-weight:700; }
  .form { padding:clamp(24px,5vw,46px); border:1px solid var(--line); border-radius:20px; background:#fff; box-shadow:var(--shadow); }
  .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
  .field { display:grid; gap:7px; }
  .field.full { grid-column:1/-1; }
  label { color:var(--ink); font-size:14px; font-weight:850; }
  .required { margin-left:6px; color:var(--navy); font-size:12px; }
  input,select,textarea { width:100%; padding:13px 14px; border:1px solid #cbd9ec; border-radius:8px; color:var(--ink); background:#fff; font:inherit; font-size:15px; line-height:1.5; }
  textarea { min-height:160px; resize:vertical; }
  input:focus,select:focus,textarea:focus { outline:none; border-color:var(--navy); box-shadow:0 0 0 3px rgba(10,60,143,.12); }
  .consent { display:flex; align-items:flex-start; gap:9px; margin-top:22px; font-size:14px; font-weight:850; line-height:1.7; }
  .consent input { width:18px; height:18px; margin:4px 0 0; accent-color:var(--navy); }
  .consent a { color:var(--navy); text-decoration:underline; text-underline-offset:2px; }
  .note { margin:18px 0 0; color:var(--muted); font-size:13px; font-weight:700; }
  .actions { display:flex; align-items:center; gap:14px; margin-top:26px; }
  .button { display:inline-flex; align-items:center; justify-content:center; min-height:54px; padding:0 24px; border:0; border-radius:8px; font:inherit; font-size:15px; font-weight:900; cursor:pointer; }
  .submit { color:#fff; background:var(--navy); box-shadow:0 14px 26px rgba(10,60,143,.25); }
  .submit:disabled { cursor:wait; opacity:.78; }
  .line { color:#1a1a1a; background:#06C755; }
  .footer { padding:26px 0; border-top:1px solid var(--line); color:var(--muted); font-size:13px; font-weight:700; }
  @media (max-width:600px) { .container { width:min(100% - 28px,920px); } .header-inner { min-height:74px; } .brand-image { height:52px; } .form-grid { grid-template-columns:1fr; gap:16px; } .actions { flex-direction:column; align-items:stretch; } .button { width:100%; } }
</style>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="/" aria-label="Tail Tech トップへ"><img class="brand-image" src="images/tail-tech-word-a-transparent.webp" alt="Tail Tech Technology × AI × DX" width="340" height="160"></a>
      <a class="back-link" href="/">トップへ戻る</a>
    </div>
  </header>
  <main>
    <div class="container">
      <div class="heading">
        <p class="eyebrow">CONTACT</p>
        <h1>お問い合わせ</h1>
        <p class="lead">初回相談・お見積もりは無料です。まだ課題が整理できていない段階でも、お気軽にご相談ください。</p>
      </div>
      <form class="form" id="contact-form" name="contact" method="POST" action="/thanks" data-netlify="true" data-netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="contact">
        <input type="hidden" name="subject" value="【Tail Tech】お問い合わせがありました">
        <p hidden><label>入力しないでください <input name="bot-field"></label></p>
        <div class="form-grid">
          <div class="field"><label for="contact-name">お名前<span class="required">必須</span></label><input id="contact-name" name="name" type="text" autocomplete="name" required></div>
          <div class="field"><label for="contact-company">会社名・店舗名</label><input id="contact-company" name="company" type="text" autocomplete="organization"></div>
          <div class="field"><label for="contact-email">メールアドレス<span class="required">必須</span></label><input id="contact-email" name="email" type="email" autocomplete="email" required></div>
          <div class="field"><label for="contact-phone">電話番号</label><input id="contact-phone" name="phone" type="tel" autocomplete="tel"></div>
          <div class="field full"><label for="contact-category">いちばん近いお悩みを選んでください<span class="required">必須</span></label><select id="contact-category" name="category" required><option value="" selected disabled>選択してください</option><option>問い合わせ・予約対応を楽にしたい</option><option>社内資料を探しやすくしたい</option><option>集客やイベントにAIを活用したい</option><option>Excel・紙・複数ツールを整理したい</option><option>まだ決まっていない・その他</option></select></div>
          <div class="field full"><label for="contact-message">ご相談内容<span class="required">必須</span></label><textarea id="contact-message" name="message" placeholder="現在お困りのことや、ご希望を自由にお書きください。" required></textarea></div>
        </div>
        <label class="consent"><input type="checkbox" required><span><a href="privacy.html" target="_blank" rel="noopener">プライバシーポリシー</a>に同意します。</span></label>
        <p class="note">通常2営業日以内にご返信します。お急ぎの場合はLINEでもご相談いただけます。</p>
        <div class="actions"><button class="button submit" id="contact-submit" type="submit" data-track="contact_form_submit">送信する</button><a class="button line" href="https://lin.ee/7qalLf4" target="_blank" rel="noopener" data-track="contact_form_line">LINEで相談する</a></div>
      </form>
    </div>
  </main>
  <footer class="footer"><div class="container">© Tail Tech</div></footer>
  <script src="js/cta-tracking.js?v=20260731-1" defer></script>
  <script>
    document.getElementById('contact-form').addEventListener('submit', () => {
      const submitButton = document.getElementById('contact-submit');
      submitButton.disabled = true;
      submitButton.setAttribute('aria-busy', 'true');
      submitButton.textContent = '送信中…';
    });
  </script>
</body>
</html>
