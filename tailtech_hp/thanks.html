<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>お問い合わせありがとうございます | Tail Tech</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { --navy:#0A3C8F; --navy-dark:#061B45; --ink:#071936; --muted:#5D6B82; --line:#DCE6F5; }
  * { box-sizing:border-box; }
  body { min-height:100dvh; display:grid; place-items:center; margin:0; padding:28px; color:var(--ink); background:linear-gradient(180deg,#f7faff,#fff); font-family:Nunito,"Hiragino Maru Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif; }
  main { width:min(640px,100%); padding:clamp(32px,7vw,64px); text-align:center; background:#fff; border:1px solid var(--line); border-radius:20px; box-shadow:0 18px 45px rgba(10,60,143,.11); }
  .mark { display:grid; width:60px; height:60px; margin:0 auto 20px; place-items:center; border-radius:50%; color:#fff; background:var(--navy); font-size:28px; font-weight:900; }
  h1 { margin:0; color:var(--navy-dark); font-size:clamp(26px,5vw,36px); line-height:1.45; }
  p { margin:16px 0 28px; color:var(--muted); font-size:15px; font-weight:700; line-height:1.9; }
  a { display:inline-flex; align-items:center; justify-content:center; min-height:52px; padding:0 24px; border-radius:8px; color:#fff; background:var(--navy); font-size:15px; font-weight:900; text-decoration:none; }
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✓</div>
    <h1>お問い合わせを受け付けました</h1>
    <p>ご連絡ありがとうございます。内容を確認のうえ、通常2営業日以内にご返信します。</p>
    <a href="/">トップページへ戻る</a>
  </main>
</body>
</html>
